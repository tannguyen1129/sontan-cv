services:
  - type: web
    name: graduation-invitation-2026
    runtime: static
    staticPublishPath: .
    buildCommand: node build-config.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: tandtnt15@gmail.com
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=300, s-maxage=3600, stale-while-revalidate=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate, s-maxage=300
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
