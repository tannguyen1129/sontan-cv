services:
  - type: web
    name: graduation-invitation-2026
    runtime: static
    staticPublishPath: .
    buildCommand: node build-config.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: tandtnt15@gmail.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
